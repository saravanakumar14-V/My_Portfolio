<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-pay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#08142c" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad-pay)" />
  <rect x="50" y="40" width="700" height="520" rx="12" fill="#070f22" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <!-- Header -->
  <rect x="50" y="40" width="700" height="45" rx="12" fill="#0c1736" />
  <text x="75" y="68" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">NEXARKS // RAZORPAY PAYMENT &amp; WEBHOOK ARCHITECTURE</text>

  <!-- Flow Chart / Architecture Diagram -->
  <!-- Step 1: Client -->
  <rect x="80" y="120" width="180" height="80" rx="8" fill="#0a1630" stroke="rgba(255, 255, 255, 0.1)" />
  <text x="170" y="152" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Client Browser</text>
  <text x="170" y="172" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Click "Pay Now"</text>

  <!-- Arrow 1 -->
  <line x1="260" y1="160" x2="330" y2="160" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
  <polygon points="330,160 322,155 322,165" fill="#38bdf8" />

  <!-- Step 2: Next.js API -->
  <rect x="340" y="120" width="180" height="80" rx="8" fill="#0d1f44" stroke="#38bdf8" stroke-width="1.5" />
  <text x="430" y="152" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Nexarks Server API</text>
  <text x="430" y="172" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Idempotent Order Gen</text>

  <!-- Arrow 2 -->
  <line x1="520" y1="160" x2="590" y2="160" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
  <polygon points="590,160 582,155 582,165" fill="#38bdf8" />

  <!-- Step 3: Razorpay Gateway -->
  <rect x="600" y="120" width="130" height="80" rx="8" fill="#0a1630" stroke="rgba(255, 255, 255, 0.1)" />
  <text x="665" y="152" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Razorpay</text>
  <text x="665" y="172" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">Checkout Modal</text>

  <!-- Webhook Return Flow -->
  <rect x="180" y="270" width="460" height="230" rx="10" fill="#040915" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />
  <text x="210" y="305" fill="#34d399" font-family="monospace" font-size="12" font-weight="600">HMAC-SHA256 WEBHOOK RECONCILIATION</text>
  
  <rect x="210" y="325" width="400" height="45" rx="6" fill="rgba(255, 255, 255, 0.03)" />
  <text x="230" y="345" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">1. Signature Verification</text>
  <text x="230" y="360" fill="#94a3b8" font-family="monospace" font-size="10">Timing-safe HMAC comparison with webhook secret</text>

  <rect x="210" y="380" width="400" height="45" rx="6" fill="rgba(255, 255, 255, 0.03)" />
  <text x="230" y="400" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">2. Transactional State Update</text>
  <text x="230" y="415" fill="#94a3b8" font-family="monospace" font-size="10">Drizzle ORM atomic update: Invoice marked PAID</text>

  <rect x="210" y="435" width="400" height="45" rx="6" fill="rgba(255, 255, 255, 0.03)" />
  <text x="230" y="455" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">3. Immutable Audit Logging</text>
  <text x="230" y="470" fill="#94a3b8" font-family="monospace" font-size="10">AuditEvent logged with actor, amounts, and provider IDs</text>
</svg>
