<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="50%" stop-color="#061026" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad-cloud)" />

  <!-- App Window Container -->
  <rect x="120" y="70" width="960" height="535" rx="16" fill="#060C1B" stroke="rgba(59, 167, 255, 0.3)" stroke-width="1.5" />

  <!-- Header -->
  <rect x="120" y="70" width="960" height="50" rx="16" fill="#09142E" />
  <circle cx="155" cy="95" r="6" fill="#FF5F56" />
  <circle cx="175" cy="95" r="6" fill="#FFBD2E" />
  <circle cx="195" cy="95" r="6" fill="#27C93F" />
  <text x="600" y="100" fill="#3BA7FF" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">CLOUD DATA DEDUPLICATION &amp; VALIDATION PLATFORM</text>
  <rect x="940" y="83" width="115" height="24" rx="4" fill="rgba(59, 167, 255, 0.15)" stroke="rgba(59, 167, 255, 0.3)" />
  <text x="997" y="99" fill="#3BA7FF" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">COMPLETED</text>

  <!-- Left: Storage Savings & Deduplication Metrics -->
  <rect x="150" y="145" width="380" height="430" rx="10" fill="#0A1630" stroke="rgba(255, 255, 255, 0.05)" />
  <text x="175" y="180" fill="#88A0C8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">STORAGE REDUCTION TELEMETRY</text>

  <!-- Deduplication Ratio Graphic -->
  <g transform="translate(175, 210)">
    <!-- Original Storage Bar -->
    <text x="0" y="0" fill="#A0B4D8" font-family="monospace" font-size="11">Raw Ingest Size: 1.28 TB</text>
    <rect x="0" y="12" width="330" height="24" rx="4" fill="#1E293B" />
    <rect x="0" y="12" width="330" height="24" rx="4" fill="#3B82F6" opacity="0.4" />
    
    <!-- Deduplicated Storage Bar -->
    <text x="0" y="65" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">Deduplicated Size: 410 GB (68% Saved)</text>
    <rect x="0" y="77" width="330" height="24" rx="4" fill="#1E293B" />
    <rect x="0" y="77" width="105" height="24" rx="4" fill="#34D399" />
  </g>

  <!-- Key Storage Numbers Grid -->
  <g transform="translate(175, 350)">
    <rect x="0" y="0" width="155" height="75" rx="6" fill="rgba(255, 255, 255, 0.03)" />
    <text x="15" y="28" fill="#88A0C8" font-family="monospace" font-size="10">UNIQUE CHUNKS</text>
    <text x="15" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="700">42,890</text>

    <rect x="175" y="0" width="155" height="75" rx="6" fill="rgba(255, 255, 255, 0.03)" />
    <text x="190" y="28" fill="#88A0C8" font-family="monospace" font-size="10">REDUNDANT BLOCKS</text>
    <text x="190" y="58" fill="#3BA7FF" font-family="sans-serif" font-size="20" font-weight="700">91,240</text>

    <rect x="0" y="90" width="330" height="60" rx="6" fill="rgba(52, 211, 153, 0.08)" stroke="rgba(52, 211, 153, 0.2)" />
    <text x="15" y="116" fill="#34D399" font-family="monospace" font-size="10" font-weight="700">INTEGRITY VERIFICATION</text>
    <text x="15" y="136" fill="#A0B4D8" font-family="monospace" font-size="10">SHA-256 Hash Matching · 100% Zero Loss</text>
  </g>

  <!-- Right: Chunking Pipeline & MongoDB Index View -->
  <rect x="555" y="145" width="495" height="430" rx="10" fill="#071124" stroke="rgba(255, 255, 255, 0.05)" />
  <text x="580" y="180" fill="#88A0C8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">BLOCK CHUNKING &amp; HASH VERIFICATION</text>

  <!-- Chunk Blocks Representation -->
  <g transform="translate(580, 205)">
    <rect x="0" y="0" width="95" height="60" rx="6" fill="#0E1B38" stroke="#3BA7FF" stroke-width="1" />
    <text x="47" y="28" fill="#67D9FF" font-family="monospace" font-size="10" text-anchor="middle">CHUNK 01</text>
    <text x="47" y="48" fill="#88A0C8" font-family="monospace" font-size="8" text-anchor="middle">sha256: 4a8f...</text>

    <rect x="110" y="0" width="95" height="60" rx="6" fill="#0E1B38" stroke="#3BA7FF" stroke-width="1" />
    <text x="157" y="28" fill="#67D9FF" font-family="monospace" font-size="10" text-anchor="middle">CHUNK 02</text>
    <text x="157" y="48" fill="#88A0C8" font-family="monospace" font-size="8" text-anchor="middle">sha256: b92e...</text>

    <rect x="220" y="0" width="95" height="60" rx="6" fill="rgba(239, 68, 68, 0.15)" stroke="#EF4444" stroke-width="1" />
    <text x="267" y="28" fill="#F87171" font-family="monospace" font-size="10" text-anchor="middle">DUPLICATE</text>
    <text x="267" y="48" fill="#F87171" font-family="monospace" font-size="8" text-anchor="middle">[SKIPPED]</text>

    <rect x="330" y="0" width="95" height="60" rx="6" fill="#0E1B38" stroke="#3BA7FF" stroke-width="1" />
    <text x="377" y="28" fill="#67D9FF" font-family="monospace" font-size="10" text-anchor="middle">CHUNK 03</text>
    <text x="377" y="48" fill="#88A0C8" font-family="monospace" font-size="8" text-anchor="middle">sha256: 77c1...</text>
  </g>

  <!-- Ingestion Log Stream -->
  <rect x="580" y="290" width="445" height="260" rx="8" fill="#040813" stroke="rgba(255, 255, 255, 0.06)" />
  <text x="600" y="325" fill="#3BA7FF" font-family="monospace" font-size="11">&gt; Stream Ingest: backup_archive_2024.tar.gz (4.8 GB)</text>
  <text x="600" y="355" fill="#A0B4D8" font-family="monospace" font-size="10">&gt; Executing Rabin-Karp boundary chunking algorithm...</text>
  <text x="600" y="385" fill="#A0B4D8" font-family="monospace" font-size="10">&gt; Querying MongoDB unique chunk index...</text>
  <text x="600" y="415" fill="#34D399" font-family="monospace" font-size="10">&gt; 3,240 duplicate blocks referenced via pointers.</text>
  <text x="600" y="445" fill="#34D399" font-family="monospace" font-size="10">&gt; Ingest Completed: 3.12 GB transfer bandwidth saved.</text>
</svg>
