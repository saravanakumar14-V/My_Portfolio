<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-sheild" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="50%" stop-color="#071220" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>
    <linearGradient id="red-panic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad-sheild)" />

  <!-- App Window Container -->
  <rect x="120" y="70" width="960" height="535" rx="16" fill="#060C18" stroke="rgba(103, 217, 255, 0.3)" stroke-width="1.5" />

  <!-- Header -->
  <rect x="120" y="70" width="960" height="50" rx="16" fill="#091428" />
  <circle cx="155" cy="95" r="6" fill="#FF5F56" />
  <circle cx="175" cy="95" r="6" fill="#FFBD2E" />
  <circle cx="195" cy="95" r="6" fill="#27C93F" />
  <text x="600" y="100" fill="#67D9FF" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">SHEiLD // PUBLIC SAFETY &amp; EMERGENCY DEFENSE APP</text>
  <rect x="940" y="83" width="115" height="24" rx="4" fill="rgba(103, 217, 255, 0.15)" stroke="rgba(103, 217, 255, 0.3)" />
  <text x="997" y="99" fill="#67D9FF" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">COMPLETED</text>

  <!-- Left: Mobile Device Frame Preview -->
  <g transform="translate(180, 140)">
    <!-- Smartphone Shell -->
    <rect x="0" y="0" width="220" height="430" rx="24" fill="#02050E" stroke="rgba(103, 217, 255, 0.4)" stroke-width="2" />
    <circle cx="110" cy="18" r="4" fill="#1E293B" />
    
    <!-- Phone Screen Content -->
    <rect x="12" y="32" width="196" height="375" rx="16" fill="#050C1B" />
    
    <!-- Big One-Tap SOS Panic Button -->
    <g transform="translate(110, 160)">
      <circle cx="0" cy="0" r="55" fill="rgba(239, 68, 68, 0.2)" />
      <circle cx="0" cy="0" r="45" fill="url(#red-panic)" stroke="#F87171" stroke-width="2" />
      <text x="0" y="8" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">SOS</text>
    </g>
    <text x="110" y="240" fill="#F87171" font-family="monospace" font-size="9" font-weight="600" text-anchor="middle">HOLD 2S TO BROADCAST</text>

    <!-- Contact Dispatch Chips -->
    <rect x="25" y="270" width="170" height="32" rx="6" fill="#0B1630" />
    <text x="38" y="290" fill="#67D9FF" font-family="monospace" font-size="9">● Emergency Contacts (3)</text>

    <rect x="25" y="310" width="170" height="32" rx="6" fill="#0B1630" />
    <text x="38" y="330" fill="#34D399" font-family="monospace" font-size="9">● Live Location Active</text>

    <rect x="25" y="350" width="170" height="32" rx="6" fill="#0B1630" />
    <text x="38" y="370" fill="#A0B4D8" font-family="monospace" font-size="9">● Nearest Police / Helpline</text>
  </g>

  <!-- Right: Live Geofence Map & Alert Telemetry -->
  <g transform="translate(450, 140)">
    <rect x="0" y="0" width="590" height="430" rx="10" fill="#040814" stroke="rgba(255, 255, 255, 0.06)" />
    
    <!-- Map Grid -->
    <g opacity="0.2" stroke="#3BA7FF" stroke-width="1">
      <line x1="0" y1="80" x2="590" y2="80" />
      <line x1="0" y1="160" x2="590" y2="160" />
      <line x1="0" y1="240" x2="590" y2="240" />
      <line x1="0" y1="320" x2="590" y2="320" />
      <line x1="120" y1="0" x2="120" y2="430" />
      <line x1="240" y1="0" x2="240" y2="430" />
      <line x1="360" y1="0" x2="360" y2="430" />
      <line x1="480" y1="0" x2="480" y2="430" />
    </g>

    <!-- Radar Pulse & Coordinate Marker -->
    <g transform="translate(295, 180)">
      <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(103, 217, 255, 0.2)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="40" fill="none" stroke="rgba(103, 217, 255, 0.4)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="8" fill="#EF4444" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#EF4444" stroke-width="1.5" />
      <text x="0" y="-18" fill="#F87171" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">LIVE INCIDENT COORDINATE</text>
    </g>

    <!-- Live Telemetry Log -->
    <rect x="25" y="290" width="540" height="115" rx="8" fill="#081022" stroke="rgba(255, 255, 255, 0.05)" />
    <text x="45" y="320" fill="#67D9FF" font-family="monospace" font-size="11">&gt; GPS Lock: 13.0827° N, 80.2707° E (Accuracy: ±2.4m)</text>
    <text x="45" y="348" fill="#34D399" font-family="monospace" font-size="10">&gt; Automated SMS Broadcast Sent to 3 Trusted Contacts</text>
    <text x="45" y="376" fill="#A0B4D8" font-family="monospace" font-size="10">&gt; Emergency Response Protocol Latency: 1.84 seconds</text>
  </g>
</svg>
