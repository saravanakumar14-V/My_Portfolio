<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="50%" stop-color="#061224" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad-ai)" />

  <!-- App Container -->
  <rect x="120" y="70" width="960" height="535" rx="16" fill="#060C1B" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />

  <!-- Header -->
  <rect x="120" y="70" width="960" height="50" rx="16" fill="#09142B" />
  <circle cx="155" cy="95" r="6" fill="#FF5F56" />
  <circle cx="175" cy="95" r="6" fill="#FFBD2E" />
  <circle cx="195" cy="95" r="6" fill="#27C93F" />
  <text x="600" y="100" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">AI RESUME ANALYZER // ATS EVALUATION ENGINE</text>
  <rect x="940" y="83" width="115" height="24" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="997" y="99" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">COMPLETED</text>

  <!-- Left Column: Resume Score & Metrics -->
  <rect x="150" y="145" width="280" height="430" rx="10" fill="#0A1630" stroke="rgba(255, 255, 255, 0.05)" />
  <text x="175" y="180" fill="#88A0C8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">ATS COMPATIBILITY SCORE</text>
  
  <!-- Circular Score Gauge -->
  <g transform="translate(290, 275)">
    <circle cx="0" cy="0" r="65" stroke="rgba(255, 255, 255, 0.08)" stroke-width="10" fill="none" />
    <circle cx="0" cy="0" r="65" stroke="#38BDF8" stroke-width="10" stroke-dasharray="320 400" stroke-linecap="round" fill="none" transform="rotate(-90)" />
    <text x="0" y="8" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">88%</text>
    <text x="0" y="28" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">STRONG MATCH</text>
  </g>

  <!-- Metrics Breakdown -->
  <rect x="170" y="370" width="240" height="40" rx="6" fill="rgba(255, 255, 255, 0.03)" />
  <text x="185" y="394" fill="#A0B4D8" font-family="monospace" font-size="11">NLP Keyword Match</text>
  <text x="385" y="394" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">92%</text>

  <rect x="170" y="420" width="240" height="40" rx="6" fill="rgba(255, 255, 255, 0.03)" />
  <text x="185" y="444" fill="#A0B4D8" font-family="monospace" font-size="11">Formatting Readability</text>
  <text x="385" y="444" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">85%</text>

  <rect x="170" y="470" width="240" height="40" rx="6" fill="rgba(255, 255, 255, 0.03)" />
  <text x="185" y="494" fill="#A0B4D8" font-family="monospace" font-size="11">Experience Alignment</text>
  <text x="385" y="494" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">87%</text>

  <!-- Right Column: Keyword Gap & Recommendations -->
  <rect x="455" y="145" width="595" height="430" rx="10" fill="#081226" stroke="rgba(255, 255, 255, 0.05)" />
  
  <text x="485" y="180" fill="#88A0C8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">EXTRACTED KEYWORD GAPS &amp; RECOMMENDATIONS</text>
  
  <!-- Missing Keywords Pill Matrix -->
  <g transform="translate(485, 205)">
    <rect x="0" y="0" width="130" height="28" rx="4" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.3)" />
    <text x="65" y="18" fill="#F87171" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">! PyTorch</text>

    <rect x="145" y="0" width="140" height="28" rx="4" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.3)" />
    <text x="215" y="18" fill="#F87171" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">! Vector Embeddings</text>

    <rect x="300" y="0" width="120" height="28" rx="4" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.3)" />
    <text x="360" y="18" fill="#F87171" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">! CI/CD Pipelines</text>
  </g>

  <!-- Verified Extracted Skills -->
  <g transform="translate(485, 250)">
    <rect x="0" y="0" width="105" height="28" rx="4" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.3)" />
    <text x="52" y="18" fill="#34D399" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">✓ Python</text>

    <rect x="120" y="0" width="115" height="28" rx="4" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.3)" />
    <text x="177" y="18" fill="#34D399" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">✓ scikit-learn</text>

    <rect x="250" y="0" width="100" height="28" rx="4" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.3)" />
    <text x="300" y="18" fill="#34D399" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">✓ Flask</text>

    <rect x="365" y="0" width="90" height="28" rx="4" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.3)" />
    <text x="410" y="18" fill="#34D399" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">✓ NLTK</text>
  </g>

  <!-- Parsing Log Stream -->
  <rect x="485" y="300" width="535" height="240" rx="8" fill="#040813" stroke="rgba(255, 255, 255, 0.06)" />
  <text x="505" y="330" fill="#38BDF8" font-family="monospace" font-size="11">&gt; Ingesting PDF: Resume_Candidate.pdf (2 pages)</text>
  <text x="505" y="358" fill="#A0B4D8" font-family="monospace" font-size="10">&gt; Extracted 1,420 tokens across Experience and Education sections.</text>
  <text x="505" y="386" fill="#A0B4D8" font-family="monospace" font-size="10">&gt; Computing TF-IDF vector similarity against Target Job Description...</text>
  <text x="505" y="414" fill="#34D399" font-family="monospace" font-size="10">&gt; Match Index: 0.8842 (Confidence: High)</text>
  <text x="505" y="442" fill="#88A0C8" font-family="monospace" font-size="10">&gt; Recommendations generated: 3 skill additions, 2 bullet point refinements.</text>
</svg>
