<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#040814" />
  <g opacity="0.1" stroke="#3BA7FF" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>
  <!-- 3D Spatial Canvas Elements -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="160" stroke="rgba(103, 217, 255, 0.3)" stroke-width="1.5" stroke-dasharray="6 6" fill="none" />
    <circle cx="0" cy="0" r="90" stroke="rgba(59, 167, 255, 0.5)" stroke-width="2" fill="none" />
    <circle cx="0" cy="0" r="40" fill="#081530" stroke="#67D9FF" stroke-width="2" />
    <text x="0" y="5" fill="#67D9FF" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">SPATIAL UI</text>
  </g>
  <rect x="50" y="40" width="300" height="40" rx="6" fill="#081024" stroke="rgba(103, 217, 255, 0.3)" />
  <text x="70" y="65" fill="#67D9FF" font-family="monospace" font-size="12" font-weight="600">REZEL // 3D INTERACTION CANVAS</text>
</svg>
