<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="50%" stop-color="#050C1F" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67D9FF" />
      <stop offset="100%" stop-color="#3BA7FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Grid Lattice Background -->
  <g opacity="0.15" stroke="#3BA7FF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="500" y1="0" x2="500" y2="675" />
    <line x1="700" y1="0" x2="700" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1100" y1="0" x2="1100" y2="675" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Desktop App Window Shell -->
  <rect x="120" y="70" width="960" height="535" rx="16" fill="#060A18" fill-opacity="0.9" stroke="rgba(103, 217, 255, 0.3)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="120" y="70" width="960" height="48" rx="16" fill="#081024" fill-opacity="0.8" />
  <circle cx="155" cy="94" r="6" fill="#FF5F56" />
  <circle cx="175" cy="94" r="6" fill="#FFBD2E" />
  <circle cx="195" cy="94" r="6" fill="#27C93F" />
  <text x="600" y="99" fill="#67D9FF" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">REZEL // SPATIAL DESKTOP ASSISTANT</text>
  <rect x="940" y="82" width="115" height="24" rx="4" fill="rgba(103, 217, 255, 0.15)" stroke="rgba(103, 217, 255, 0.3)" />
  <text x="997" y="98" fill="#67D9FF" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">ACTIVE DEV</text>

  <!-- Left Sidebar (Tool & Memory Registry) -->
  <rect x="140" y="135" width="220" height="445" rx="10" fill="#0A1329" stroke="rgba(255, 255, 255, 0.05)" />
  <text x="160" y="165" fill="#88A0C8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">SYSTEM REGISTRY</text>
  
  <rect x="155" y="185" width="190" height="34" rx="6" fill="rgba(103, 217, 255, 0.1)" stroke="rgba(103, 217, 255, 0.25)" />
  <text x="175" y="206" fill="#67D9FF" font-family="monospace" font-size="11">● Spatial Viewport</text>
  
  <rect x="155" y="230" width="190" height="34" rx="6" fill="rgba(255, 255, 255, 0.03)" />
  <text x="175" y="251" fill="#A0B4D8" font-family="monospace" font-size="11">◌ Vector Memory (SQLite)</text>

  <rect x="155" y="275" width="190" height="34" rx="6" fill="rgba(255, 255, 255, 0.03)" />
  <text x="175" y="296" fill="#A0B4D8" font-family="monospace" font-size="11">◌ Tool Execution Sandboxes</text>

  <rect x="155" y="320" width="190" height="34" rx="6" fill="rgba(255, 255, 255, 0.03)" />
  <text x="175" y="341" fill="#A0B4D8" font-family="monospace" font-size="11">◌ Autonomous Planner</text>

  <!-- Center 3D Spatial Canvas Area -->
  <rect x="380" y="135" width="675" height="445" rx="10" fill="#040714" stroke="rgba(103, 217, 255, 0.2)" />
  
  <!-- Central Spatial Energy Orbit & Nodes -->
  <g transform="translate(717, 335)" filter="url(#glow)">
    <circle cx="0" cy="0" r="140" stroke="rgba(103, 217, 255, 0.2)" stroke-width="1" stroke-dasharray="4 6" fill="none" />
    <circle cx="0" cy="0" r="85" stroke="rgba(59, 167, 255, 0.4)" stroke-width="1.5" stroke-dasharray="8 4" fill="none" />
    <circle cx="0" cy="0" r="35" fill="#081530" stroke="#67D9FF" stroke-width="2" />
    <text x="0" y="5" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">CORE</text>

    <!-- Planetary Nodes -->
    <g transform="translate(-90, -70)">
      <circle cx="0" cy="0" r="16" fill="#0A1835" stroke="#3BA7FF" stroke-width="1.5" />
      <text x="0" y="4" fill="#67D9FF" font-family="monospace" font-size="9" text-anchor="middle">LLM</text>
    </g>
    <line x1="0" y1="0" x2="-90" y2="-70" stroke="rgba(103, 217, 255, 0.4)" stroke-width="1.5" />

    <g transform="translate(100, -60)">
      <circle cx="0" cy="0" r="16" fill="#0A1835" stroke="#67D9FF" stroke-width="1.5" />
      <text x="0" y="4" fill="#67D9FF" font-family="monospace" font-size="9" text-anchor="middle">MEM</text>
    </g>
    <line x1="0" y1="0" x2="100" y2="-60" stroke="rgba(103, 217, 255, 0.4)" stroke-width="1.5" />

    <g transform="translate(85, 75)">
      <circle cx="0" cy="0" r="16" fill="#0A1835" stroke="#3BA7FF" stroke-width="1.5" />
      <text x="0" y="4" fill="#67D9FF" font-family="monospace" font-size="9" text-anchor="middle">TOOL</text>
    </g>
    <line x1="0" y1="0" x2="85" y2="75" stroke="rgba(103, 217, 255, 0.4)" stroke-width="1.5" />

    <g transform="translate(-105, 60)">
      <circle cx="0" cy="0" r="16" fill="#0A1835" stroke="#67D9FF" stroke-width="1.5" />
      <text x="0" y="4" fill="#67D9FF" font-family="monospace" font-size="9" text-anchor="middle">R3F</text>
    </g>
    <line x1="0" y1="0" x2="-105" y2="60" stroke="rgba(103, 217, 255, 0.4)" stroke-width="1.5" />
  </g>

  <!-- Bottom Telemetry Bar -->
  <rect x="400" y="520" width="635" height="42" rx="6" fill="#081024" stroke="rgba(255, 255, 255, 0.08)" />
  <text x="420" y="546" fill="#67D9FF" font-family="monospace" font-size="11">● STATUS: LOCAL INFERENCE READY</text>
  <text x="780" y="546" fill="#88A0C8" font-family="monospace" font-size="11">TAURI RUST BACKEND · ZERO CLOUD LEAK</text>
</svg>
