<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ Gourmet Cyber Kitchen Animation ✨</title>
  <style>
    :root {
      --primary: #ff6b35;
      --secondary: #f7c59f;
      --accent: #ffd166;
      --bg: #0f111a;
      --card: #1a1d29;
      --text: #f0f4f8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1b2033 0%, #0c0e17 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }

    .title {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff9a3c, #ff6f59, #ffcc29);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #8c9ba5;
      font-size: 0.95rem;
      margin-bottom: 24px;
      text-align: center;
    }

    .menu-bar {
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      padding: 8px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .menu-btn {
      background: transparent;
      border: none;
      color: #aaa;
      padding: 10px 22px;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-btn.active, .menu-btn:hover {
      background: linear-gradient(135deg, #ff6b35, #f75590);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
    }

    .stage-container {
      position: relative;
      width: 420px;
      height: 440px;
      background: var(--card);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 107, 53, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .food-display {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 2;
    }

    .food-layer {
      opacity: 0;
      transform: translateY(-50px) scale(0.6);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-size: 1.1rem;
      font-weight: bold;
      padding: 6px 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .food-layer.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Food specifics */
    .bun-top { background: linear-gradient(135deg, #f4a261, #e76f51); color: #fff; border-radius: 30px 30px 10px 10px; padding: 12px 36px; }
    .sauce { background: linear-gradient(135deg, #e63946, #d90429); color: #fff; }
    .lettuce { background: linear-gradient(135deg, #52b788, #2d6a4f); color: #fff; }
    .tomato { background: linear-gradient(135deg, #ff4d6d, #c9184a); color: #fff; }
    .cheese { background: linear-gradient(135deg, #ffb703, #fb8500); color: #000; }
    .patty { background: linear-gradient(135deg, #6c584c, #3f2e21); color: #fff; padding: 10px 34px; }
    .bun-bottom { background: linear-gradient(135deg, #f4a261, #e76f51); color: #fff; border-radius: 10px 10px 24px 24px; padding: 10px 36px; }

    .action-btn {
      margin-top: 25px;
      background: linear-gradient(135deg, #ff9a3c, #ff6f59);
      border: none;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 38px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 111, 89, 0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 35px rgba(255, 111, 89, 0.6);
    }

    .sparkle-badge {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 209, 102, 0.15);
      border: 1px solid rgba(255, 209, 102, 0.4);
      color: #ffd166;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .floating-smoke {
      position: absolute;
      font-size: 1.8rem;
      animation: floatUp 2.5s infinite linear;
      opacity: 0;
    }

    @keyframes floatUp {
      0% { transform: translateY(20px) scale(0.6); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-70px) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="title">✨ CYBER CULINARY STUDIO ✨</div>
  <div class="subtitle">Interactive Food Creator & Animation Suite</div>

  <div class="menu-bar">
    <button class="menu-btn active" onclick="cook('burger')">🍔 Gourmet Burger</button>
    <button class="menu-btn" onclick="cook('pizza')">🍕 Woodfired Pizza</button>
    <button class="menu-btn" onclick="cook('ramen')">🍜 Midnight Ramen</button>
  </div>

  <div class="stage-container" id="stage">
    <div class="sparkle-badge">🔥 CHEF MASTERPIECE</div>
    <div class="particles" id="particles"></div>
    <div class="food-display" id="foodDisplay"></div>
  </div>

  <button class="action-btn" onclick="triggerCook()">
    <span>👨‍🍳 Cook & Animate Dish</span>
  </button>

  <script>
    const DISH_DATA = {
      burger: [
        { text: "👑 Golden Sesame Bun", class: "bun-top" },
        { text: "🥫 Truffle Aioli Glaze", class: "sauce" },
        { text: "🥬 Crisp Butterhead Lettuce", class: "lettuce" },
        { text: "🍅 Sun-Ripened Tomato", class: "tomato" },
        { text: "🧀 Triple Aged Cheddar", class: "cheese" },
        { text: "🥩 Flame-Seared Wagyu Patty", class: "patty" },
        { text: "🥖 Toasted Brioche Bun Base", class: "bun-bottom" }
      ],
      pizza: [
        { text: "🌿 Fresh Garden Basil", class: "lettuce" },
        { text: "🫒 Kalamata Olives & Oregano", class: "sauce" },
        { text: "🧀 Buffalo Mozzarella", class: "cheese" },
        { text: "🥫 San Marzano Crushed Sauce", class: "tomato" },
        { text: "🔥 Wood-Fired Crust Base", class: "bun-bottom" }
      ],
      ramen: [
        { text: "♨️ Aromatic Garlic Oil & Steam", class: "sauce" },
        { text: "🥚 Seasoned Ajitama Egg", class: "cheese" },
        { text: "🥩 Braised Tender Chashu", class: "patty" },
        { text: "🍜 Springy Ramen Noodles", class: "bun-top" },
        { text: "🥣 18h Golden Tonkotsu Broth Bowl", class: "bun-bottom" }
      ]
    };

    let currentDish = 'burger';

    function cook(dish) {
      currentDish = dish;
      document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      triggerCook();
    }

    function triggerCook() {
      const display = document.getElementById('foodDisplay');
      const particles = document.getElementById('particles');
      display.innerHTML = '';
      particles.innerHTML = '';

      // Add steam effect
      for(let i=0; i<4; i++){
        const smoke = document.createElement('div');
        smoke.className = 'floating-smoke';
        smoke.innerText = '♨️';
        smoke.style.left = `${30 + i * 15}%`;
        smoke.style.top = '25%';
        smoke.style.animationDelay = `${i * 0.4}s`;
        particles.appendChild(smoke);
      }

      const layers = DISH_DATA[currentDish];
      
      layers.forEach((layer, idx) => {
        const div = document.createElement('div');
        div.className = `food-layer ${layer.class}`;
        div.innerText = layer.text;
        display.appendChild(div);

        setTimeout(() => {
          div.classList.add('show');
        }, idx * 160);
      });
    }

    // Initial render
    triggerCook();
  </script>
</body>
</html>
